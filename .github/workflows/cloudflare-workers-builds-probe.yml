name: Probe Cloudflare Workers Builds API

on:
  push:
    branches:
      - chore/cloudflare-builds-api-probe
    paths:
      - ".github/workflows/cloudflare-workers-builds-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Workers Builds capability without exposing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          api_get() {
            local path="$1"
            local out="$2"
            curl --silent --show-error --output "$out" --write-out "%{http_code}" \
              --header "$AUTH" \
              "${BASE}${path}"
          }

          workers_code=$(api_get "/workers/scripts" /tmp/workers.json)
          echo "workers_scripts_http=${workers_code}"
          if [ "$workers_code" != "200" ]; then
            jq -c '{success, errors: [.errors[]? | {code, message}]}' /tmp/workers.json
            exit 1
          fi

          flow_tag=$(jq -r '.result[]? | select(.id == "masa-flow-runner") | .tag // empty' /tmp/workers.json | head -1)
          line_tag=$(jq -r '.result[]? | select(.id == "masa-line-dispatch-cron") | .tag // empty' /tmp/workers.json | head -1)
          echo "masa_flow_runner_present=$([ -n "$flow_tag" ] && echo yes || echo no)"
          echo "line_dispatch_present=$([ -n "$line_tag" ] && echo yes || echo no)"

          if [ -n "$line_tag" ]; then
            line_triggers_code=$(api_get "/builds/workers/${line_tag}/triggers" /tmp/line-triggers.json)
            echo "line_triggers_http=${line_triggers_code}"
            if [ "$line_triggers_code" = "200" ]; then
              jq -c '{count: (.result | length), triggers: [.result[]? | {trigger_name, trigger_uuid, root_directory, branch_includes, path_includes, repo_name: .repo_connection.repo_name, repo_id: .repo_connection.repo_id, provider_account_name: .repo_connection.provider_account_name, repo_connection_uuid: .repo_connection.repo_connection_uuid, has_build_token: (.build_token_uuid != null)}]}' /tmp/line-triggers.json
            else
              jq -c '{success, errors: [.errors[]? | {code, message}]}' /tmp/line-triggers.json
            fi
          fi

          tokens_code=$(api_get "/builds/tokens" /tmp/build-tokens.json)
          echo "build_tokens_http=${tokens_code}"
          if [ "$tokens_code" = "200" ]; then
            jq -c '{count: (.result | length), tokens: [.result[]? | {build_token_name, build_token_uuid, owner_type, has_cloudflare_token_id: (.cloudflare_token_id != null)}]}' /tmp/build-tokens.json

            line_cf_token_id=$(jq -r '.result[]? | select(.build_token_name == "masa-line-dispatch-cron build token") | .cloudflare_token_id // empty' /tmp/build-tokens.json | head -1)
            if [ -n "$line_cf_token_id" ]; then
              details_code=$(curl --silent --show-error --output /tmp/token-details.json --write-out "%{http_code}" \
                --header "$AUTH" \
                "${API}/user/tokens/${line_cf_token_id}")
              echo "line_build_token_details_http=${details_code}"
              if [ "$details_code" = "200" ]; then
                jq -c '{name: .result.name, status: .result.status, permissions: ([.result.policies[]?.permission_groups[]?.name] | unique), policy_count: (.result.policies | length)}' /tmp/token-details.json
              else
                jq -c '{success, errors: [.errors[]? | {code, message}]}' /tmp/token-details.json
              fi
            fi
          else
            jq -c '{success, errors: [.errors[]? | {code, message}]}' /tmp/build-tokens.json
          fi

          if [ -n "$flow_tag" ]; then
            flow_triggers_code=$(api_get "/builds/workers/${flow_tag}/triggers" /tmp/flow-triggers.json)
            echo "flow_triggers_http=${flow_triggers_code}"
            if [ "$flow_triggers_code" = "200" ]; then
              jq -c '{count: (.result | length), triggers: [.result[]? | {trigger_name, trigger_uuid, root_directory, branch_includes, path_includes, repo_name: .repo_connection.repo_name, repo_id: .repo_connection.repo_id, provider_account_name: .repo_connection.provider_account_name, repo_connection_uuid: .repo_connection.repo_connection_uuid, has_build_token: (.build_token_uuid != null)}]}' /tmp/flow-triggers.json
            else
              jq -c '{success, errors: [.errors[]? | {code, message}]}' /tmp/flow-triggers.json
            fi
          fi
