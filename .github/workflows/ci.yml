name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Cost guard: when a PR receives a newer commit, the older CI result is stale.
# Cancel that stale run instead of paying to finish work that can no longer merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      # Temporary lock refresh for the security override repair on PR #214.
      # This step and the artifact upload are removed once the regenerated lock is committed.
      - name: Regenerate lock for patched transitives
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload regenerated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr214-regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Security regression tests
        run: npm test

      - name: Typecheck release delta
        env:
          TYPECHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TYPECHECK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run typecheck:release

      - name: Verify production build
        run: npm run build

      - name: Isolated Worker preview
        run: npm run test:preview

      - name: Dependency security gate
        run: npm run security:check

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
