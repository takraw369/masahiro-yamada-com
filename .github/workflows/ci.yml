name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One-time, PR-scoped migration helper. It can write only on the owner's exact
  # release-conductor branch, and only PR #55. Remove after the verified Astro 7
  # candidate lockfile is committed.
  canonicalize-lock:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 55 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/release-conductor-20260907' && github.actor == 'takraw369'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out owner PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Generate verified Astro 7 lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit candidate lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: canonicalize Astro 7 dependency lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      # Temporary migration bridge: package.json intentionally moved across Astro
      # majors. Generate the candidate lockfile in CI, test it, then commit the
      # verified lockfile and remove this step before merge.
      - name: Generate candidate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Capture candidate lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astro7-candidate-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Security regression tests
        run: npm test

      - name: Typecheck release delta
        env:
          TYPECHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TYPECHECK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run typecheck:release

      - name: Verify production build
        run: npm run build

      - name: Isolated Worker preview
        run: npm run test:preview

      - name: Dependency security gate
        run: npm run security:check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
